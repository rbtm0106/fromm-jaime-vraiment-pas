<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromm Web Player - Channels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <nav class="w-full max-w-4xl mb-4 p-4 bg-gray-800 rounded-lg flex justify-between items-center shadow-lg border border-gray-700">
        <div class="flex gap-4">
            <a href="channels.html" class="text-white font-semibold border-b-2 border-blue-400" data-i18n="nav_channels">Channels</a>
        </div>
        <div class="flex gap-3 sm:gap-4 items-center">
            <div class="flex gap-2 items-center border-r border-gray-700 pr-3">
                <select class="lang-selector bg-gray-800 text-gray-300 text-xs sm:text-sm border border-gray-600 rounded-md focus:outline-none focus:border-blue-400 py-1 px-2 cursor-pointer transition-colors hover:bg-gray-700">
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="hanyang">☘️ 하냥어</option>
                </select>
            </div>
            <button onclick="window.open('converter.html', '_blank')" class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 hover:border-blue-400 rounded-full text-xs font-semibold text-blue-400 transition-colors shadow-sm cursor-pointer">
                <i data-lucide="file-video" class="w-3.5 h-3.5"></i>
                <span data-i18n="nav_guide">.ts to .mp4 Guide</span>
            </button>
            <div id="session-timer" class="hidden flex items-center gap-1.5 px-3 py-1 bg-gray-900 border border-gray-700 rounded-full text-xs font-mono text-gray-400 shadow-inner">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                <span id="time-remaining">--:--</span>
            </div>
            <button id="logout-btn" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <i data-lucide="log-out" class="w-4 h-4"></i> <span data-i18n="nav_logout">Logout</span>
            </button>
        </div>
    </nav>

    <main class="w-full max-w-4xl">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl border border-gray-700">
            <h1 class="text-3xl font-extrabold text-blue-400 mb-8 text-center" data-i18n="title_subscribed_channels">Subscribed Channels</h1>

            <div id="loader" class="flex flex-col items-center justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
                <p class="text-gray-400" data-i18n="status_fetching_channels">Fetching your channels...</p>
            </div>

            <div id="error-message" class="hidden text-center py-8">
                <p class="text-red-400 mb-4"></p>
                <button onclick="location.reload()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white" data-i18n="btn_retry">Retry</button>
            </div>

            <div id="channel-grid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 gap-6"></div>
            
            <p id="no-channels-message" class="hidden text-gray-400 col-span-full text-center py-4" data-i18n="msg_no_channels">
                You are not subscribed to any channels yet.
            </p>
        </div>
    </main>

    <script src="assets/common.js"></script>
    <script>
        FrommApp.initPageCommon({ requireLogin: true });

        async function fetchChannels() {
            const loader = document.getElementById('loader');
            const grid = document.getElementById('channel-grid');
            const errorContainer = document.getElementById('error-message');
            const noChannelsMsg = document.getElementById('no-channels-message');

            try {
                const data = await FrommApp.apiFetch('/channels');

                if (data.success && data.data && data.data.channels) {
                    const subscribedChannels = data.data.channels.filter(c => c.isSubscribed);

                    if (subscribedChannels.length === 0) {
                        loader.classList.add('hidden');
                        noChannelsMsg.classList.remove('hidden');
                        return;
                    }

                    const html = subscribedChannels.map(channel => {
                        const safeName = FrommApp.escapeHtml(channel.channelName);
                        const safeDefault = (channel.searchChannelName && channel.searchChannelName.default)
                            ? `<p class="text-sm text-gray-400 truncate px-1">${FrommApp.escapeHtml(channel.searchChannelName.default)}</p>`
                            : '';

                        return `
                            <a href="videos.html?channel_id=${channel.id}" 
                               onclick="sessionStorage.setItem('fromm_channel_id', '${channel.id}')"
                               class="block bg-gray-700 p-5 pt-6 rounded-xl hover:bg-gray-600 transition-all duration-200 shadow-lg text-center aspect-square flex flex-col justify-between border border-gray-600 hover:border-blue-400 group">
                                <div class="w-24 h-24 bg-gray-600 rounded-full mb-4 mx-auto overflow-hidden border-2 border-gray-500 group-hover:border-blue-400 transition-colors flex-shrink-0">
                                    <img src="${channel.profileUrl}" alt="${safeName} profile" loading="lazy" decoding="async" class="w-full h-full object-cover">
                                </div>
                                <h2 class="font-bold text-lg text-white px-1 mt-auto truncate" title="${safeName}">
                                    ${safeName}
                                </h2>
                                ${safeDefault}
                                <p class="text-xs text-blue-400 mt-2 font-medium uppercase tracking-wider flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity" data-i18n="btn_view_videos">
                                    ${window.t ? window.t('btn_view_videos') : 'View Videos'}
                                </p>
                            </a>
                        `;
                    }).join('');

                    loader.classList.add('hidden');
                    grid.innerHTML = html;
                    grid.classList.remove('hidden');
                } else {
                    throw new Error('Invalid data format received from API.');
                }
            } catch (err) {
                console.error(err);
                loader.classList.add('hidden');
                errorContainer.classList.remove('hidden');
                errorContainer.querySelector('p').textContent = err.message;
            }
        }

        FrommApp.onReady(fetchChannels);
    </script>
    <script src="assets/i18n/i18n_data.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</body>
</html>
